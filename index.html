<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Directorio de Contactos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="tarjeta">
      <h1>Directorio de Contactos</h1>

      <div class="formulario">
        <input type="text" id="nombre" placeholder="Nombre" />
        <input type="text" id="telefono" placeholder="Teléfono" />
        <button id="btn-agregar">Agregar</button>
      </div>

      <input type="text" id="buscador" placeholder="Buscar contacto por nombre..." />

      <ul id="lista"></ul>
      <p id="vacio" class="vacio">Todavía no agregaste contactos.</p>

      <p class="contador">Contactos: <span id="contador">0</span></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
